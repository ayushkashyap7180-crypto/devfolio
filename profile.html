
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush - Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            background: white;
            padding: 30px;
            width: 320px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 12px #0002;
        }

        h1 {
            color: #29233d;
        }

        li {
            background: #eeeaf5;
            padding: 10px;
            margin: 8px;
            list-style: none;
            border-radius: 8px;
        }

        a {
            color: #29233d;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <main class="profile-card">
        <header>
            <h1>Ayush Kashyap</h1>
            <h3>Computer Science Student</h3>
        </header>

        <section>
            <h2>About Me</h2>
            <p>
                Hello! I am Ayush, a computer science student
                interested in programming, web development,
                and technology.
            </p>
        </section>

        <section>
            <h2>My Skills</h2>
            <ul>
                <li>HTML & CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
            </ul>
        </section>

        <footer>
            <a href="https://github.com/ayushkashyap7180-crypto"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Visit Ayush Kashyap's GitHub profile">
                Visit My GitHub
            </a>
        </footer>
    </main>

</body>
</html>
